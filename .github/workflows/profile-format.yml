name: Profile format helper

on:
  push:
    branches:
      - arena/9e53c41a-seylane-sabz-learning

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arena/9e53c41a-seylane-sabz-learning
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/web/src/pages/m/ProfilePage.tsx functions/src/services/users.ts functions/src/web-handler.ts
      - name: Commit formatted profile files
        run: |
          if git diff --quiet -- apps/web/src/pages/m/ProfilePage.tsx functions/src/services/users.ts functions/src/web-handler.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/m/ProfilePage.tsx functions/src/services/users.ts functions/src/web-handler.ts
          git commit -m "style(profile): format implementation"
          git push origin HEAD:arena/9e53c41a-seylane-sabz-learning
