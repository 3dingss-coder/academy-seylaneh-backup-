name: Redesign format helper

on:
  push:
    branches:
      - arena/9e53c41a-seylane-sabz-learning

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arena/9e53c41a-seylane-sabz-learning
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/web/src/pages/auth/OnboardingPage.tsx apps/web/src/pages/m/HomePage.tsx apps/web/src/pages/m/MentorPage.tsx apps/web/src/pages/m/PackagePage.tsx apps/web/src/pages/m/SectionPage.tsx apps/web/src/pages/NotFoundPage.tsx
      - name: Commit formatted redesign files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/auth/OnboardingPage.tsx apps/web/src/pages/m/HomePage.tsx apps/web/src/pages/m/MentorPage.tsx apps/web/src/pages/m/PackagePage.tsx apps/web/src/pages/m/SectionPage.tsx apps/web/src/pages/NotFoundPage.tsx
          git commit -m "style(redesign): format remaining marketer pages"
          git push origin HEAD:arena/9e53c41a-seylane-sabz-learning
