<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/push-icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/push-icons/push-icon-192.png" />
    <link rel="preload" as="image" href="/brand/mascot.webp" type="image/webp" />
    <link rel="apple-touch-icon" sizes="180x180" href="/push-icons/apple-touch-icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="سیلانه‌سبز" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#059669" />
    <meta name="description" content="آکادمی سیلانه — آموزش محصولات برای بازاریاب‌ها" />
    <title>آکادمی سیلانه</title>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #4b2877;
        color: #fff;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Tahoma,
          sans-serif;
        transition:
          opacity 0.45s ease,
          visibility 0.45s;
      }
      #boot.boot-out {
        opacity: 0;
        visibility: hidden;
      }
      #boot video,
      #boot img {
        position: absolute;
        inset: 0;
        /* !important: the app's Tailwind preflight (img, video { height: auto }) is boosted in
           specificity and would otherwise win, stretching the frame to its intrinsic ratio. */
        width: 100% !important;
        height: 100% !important;
        max-width: none !important;
        object-fit: cover;
        object-position: 50% 45%;
      }
      /* Landscape screens: show the whole portrait frame instead of cropping the mascot's head. */
      @media (min-aspect-ratio: 1/1) {
        #boot video,
        #boot img {
          object-fit: contain;
          /* the portrait frame is 56.25vh wide; fade its side edges into the page colour so no box shows */
          -webkit-mask-image: linear-gradient(
            to right,
            transparent calc(50% - 28.2vh),
            #000 calc(50% - 19vh),
            #000 calc(50% + 19vh),
            transparent calc(50% + 28.2vh)
          );
          mask-image: linear-gradient(
            to right,
            transparent calc(50% - 28.2vh),
            #000 calc(50% - 19vh),
            #000 calc(50% + 19vh),
            transparent calc(50% + 28.2vh)
          );
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="آکادمی سیلانه سبز در حال بارگذاری">
      <img
        src="/brand/boot/boot-poster.webp"
        width="720"
        height="1280"
        alt=""
        fetchpriority="high"
      />
      <video
        id="boot-video"
        src="/brand/boot/boot-loading.mp4"
        poster="/brand/boot/boot-poster.webp"
        width="720"
        height="1280"
        muted
        playsinline
        preload="auto"
        aria-hidden="true"
      ></video>
    </div>
    <div id="root"></div>
    <noscript>برای استفاده از این برنامه، جاوااسکریپت مرورگر را فعال کنید.</noscript>
    <script src="/boot.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
